name: Build Windows installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set version from tag
        shell: pwsh
        run: npm version ($env:GITHUB_REF_NAME -replace '^v', '') --no-git-tag-version --allow-same-version
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error
