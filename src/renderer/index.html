<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>League Account Launcher</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/accounts.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="app-header">
        <img src="assets/logo.png" alt="" width="36" height="36">
        <span class="brand">League Account Launcher</span>
        <button type="button" id="open-settings" class="secondary-btn" disabled>Settings</button>
    </header>
    <main>
        <p id="notice" class="message" role="status" hidden></p>
        <section id="accounts-view" aria-labelledby="accounts-title" hidden>
            <div class="section-header">
                <h1 id="accounts-title">League accounts</h1>
                <button type="button" id="add-account" class="primary-btn">Add account</button>
            </div>
            <p id="empty" class="empty" hidden>Add a Riot account to start League of Legends.</p>
            <ul id="account-list" class="accounts"></ul>
        </section>
        <section id="vault-view" class="vault-view" hidden>
            <h1>Unlock accounts</h1>
            <form id="unlock-form">
                <label for="unlock-password">Vault password</label>
                <input id="unlock-password" type="password" autocomplete="current-password" required>
                <p class="form-error" role="alert" hidden></p>
                <button class="primary-btn">Unlock</button>
            </form>
        </section>
    </main>

    <footer id="launch-status" hidden>
        <div>
            <p id="launch-message" role="status"></p>
            <progress id="launch-progress" aria-label="Sign-in progress" max="100"></progress>
        </div>
        <button type="button" id="cancel-launch" class="secondary-btn">Cancel</button>
    </footer>

    <template id="account-template">
        <li class="account">
            <div class="account-identity">
                <strong class="account-label"></strong>
                <span class="account-detail"></span>
            </div>
            <div class="account-actions">
                <button type="button" class="secondary-btn shortcut-account">Create shortcut</button>
                <button type="button" class="secondary-btn edit-account">Edit</button>
                <button type="button" class="primary-btn play-account">Play</button>
            </div>
        </li>
    </template>

    <dialog id="account-dialog" aria-labelledby="account-title">
        <form id="account-form">
            <h2 id="account-title">Add account</h2>
            <p id="account-username" hidden></p>
            <div id="account-method-field" class="account-field">
                <label for="account-method">Add using</label>
                <select id="account-method">
                    <option value="password">Riot login and password</option>
                    <option value="session">Active Riot session</option>
                </select>
            </div>
            <p id="capture-help">Sign in through the Riot Client, tick "Stay signed in", and open League. Then save the active session here.</p>
            <div id="account-login-field" class="account-field">
                <label for="account-login">Riot login username</label>
                <input id="account-login" autocomplete="username" maxlength="256">
            </div>
            <div id="account-password-field" class="account-field">
                <label for="account-password">Riot password</label>
                <input type="password" id="account-password" autocomplete="off" maxlength="1024">
            </div>
            <label for="account-label">Label</label>
            <input id="account-label" maxlength="200" placeholder="Optional">
            <label class="checkbox"><input type="checkbox" id="hide-on-launch"> Hide this window on launch</label>
            <p class="form-error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" id="delete-account" class="danger-btn">Delete</button>
                <button type="button" id="manual-login" class="secondary-btn">Sign in manually</button>
                <button type="button" class="secondary-btn" data-close>Cancel</button>
                <button id="save-account" class="primary-btn">Save session</button>
            </div>
        </form>
    </dialog>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
        <form id="settings-form">
            <h2 id="settings-title">Settings</h2>
            <label for="league-path">League client</label>
            <div class="inline-field">
                <input id="league-path" readonly placeholder="LeagueClient.exe not found">
                <button type="button" id="browse-path" class="secondary-btn">Browse</button>
            </div>
            <label for="theme">Appearance</label>
            <select id="theme">
                <option value="system">Match Windows</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <label class="checkbox"><input type="checkbox" id="start-minimized"> Start in the system tray</label>
            <p class="form-error" role="alert" hidden></p>
            <div class="settings-tools">
                <button type="button" id="vault-settings" class="secondary-btn">Vault password</button>
                <button type="button" id="import-accounts" class="secondary-btn">Import accounts</button>
                <button type="button" id="export-accounts" class="secondary-btn">Export accounts</button>
            </div>
            <div class="dialog-actions">
                <button type="button" class="secondary-btn" data-close>Cancel</button>
                <button class="primary-btn">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="vault-dialog" aria-labelledby="vault-title">
        <form id="vault-form">
            <h2 id="vault-title">Vault password</h2>
            <div id="vault-current-field">
                <label for="vault-current">Current password</label>
                <input id="vault-current" type="password" autocomplete="current-password" maxlength="1024">
            </div>
            <label for="vault-next">New password</label>
            <input id="vault-next" type="password" autocomplete="new-password" maxlength="1024" required>
            <p class="form-error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" id="disable-vault" class="danger-btn">Remove password</button>
                <button type="button" class="secondary-btn" data-close>Cancel</button>
                <button class="primary-btn">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="backup-dialog" aria-labelledby="backup-title">
        <form id="backup-form">
            <h2 id="backup-title"></h2>
            <label for="backup-password">Backup passphrase</label>
            <input id="backup-password" type="password" autocomplete="off" required>
            <p class="form-error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="secondary-btn" data-close>Cancel</button>
                <button id="backup-submit" class="primary-btn">Continue</button>
            </div>
        </form>
    </dialog>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <form method="dialog">
            <h2 id="confirm-title"></h2>
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button class="secondary-btn" value="cancel" autofocus>Cancel</button>
                <button id="confirm-button" class="danger-btn" value="confirm"></button>
            </div>
        </form>
    </dialog>
</body>
</html>
